# ═══════════════════════════════════
# CONFIGURACIÓN BASE (todos los profiles)
# ═══════════════════════════════════

spring.application.name=SafeCity-Backend

# Profile activo. Render lo sobreescribe con la env var SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto: Render asigna PORT dinámicamente. Default 8080 para local.
server.port=${PORT:8080}

# Forzar IPv4 — Supabase y Render pueden tener problemas con IPv6
spring.main.cloud-platform=none
spring.jpa.open-in-view=false

# ═══════════════════════════════════
# Swagger/OpenAPI
# ═══════════════════════════════════
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ═══════════════════════════════════
# Jackson (serialización JSON)
# ═══════════════════════════════════
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Bogota

# ═══════════════════════════════════
# CORS — orígenes permitidos desde env vars
# ═══════════════════════════════════
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ═══════════════════════════════════
# Actuator — health check para Render
# ═══════════════════════════════════
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ═══════════════════════════════════
# File Upload — fotos de incidentes
# ═══════════════════════════════════
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ═══════════════════════════════════
# AI Classification — GPT-4o-mini (OpenAI)
# Para cambiar de proveedor: sobrescribe OPENAI_API_URL con otro endpoint compatible
# ═══════════════════════════════════
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}

# ═══════════════════════════════════
# RapidAPI — Facebook Scraper (OSINT)
# IMPORTANTE: configurar RAPIDAPI_KEY como variable de entorno en Render
# ═══════════════════════════════════
app.rapidapi.key=${RAPIDAPI_KEY:}
app.rapidapi.facebook-host=facebook-scraper3.p.rapidapi.com

# ═══════════════════════════════════════════════════════════
# OSINT V2 — Scheduler, Rate Limiting, Deduplicación
# ═══════════════════════════════════════════════════════════
app.osint.scheduler.enabled=${OSINT_SCHEDULER_ENABLED:true}
app.osint.default-city=${OSINT_DEFAULT_CITY:Pasto}
app.osint.max-items-per-execution=${OSINT_MAX_ITEMS:10}
app.osint.dedup-radius-meters=${OSINT_DEDUP_RADIUS:500}
app.osint.dedup-hours=${OSINT_DEDUP_HOURS:12}

# ═══════════════════════════════════
# Configuración de Correo (JavaMailSender)
# ═══════════════════════════════════
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
