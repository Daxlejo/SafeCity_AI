# ═══════════════════════════════════
# CONFIGURACIÓN BASE (todos los profiles)
# ═══════════════════════════════════

spring.application.name=SafeCity-Backend

# Profile activo. Render lo sobreescribe con la env var SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto: Render asigna PORT dinámicamente. Default 8080 para local.
server.port=${PORT:8080}

# Forzar IPv4 — Supabase y Render pueden tener problemas con IPv6
spring.main.cloud-platform=none
spring.jpa.open-in-view=false

# ═══════════════════════════════════
# Swagger/OpenAPI
# ═══════════════════════════════════
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ═══════════════════════════════════
# Jackson (serialización JSON)
# ═══════════════════════════════════
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Bogota

# ═══════════════════════════════════
# CORS — orígenes permitidos desde env vars
# ═══════════════════════════════════
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ═══════════════════════════════════
# Actuator — health check para Render
# ═══════════════════════════════════
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ═══════════════════════════════════
# File Upload — fotos de incidentes
# ═══════════════════════════════════
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ═══════════════════════════════════
# AI Classification — GPT-4o-mini (OpenAI)
# Para cambiar de proveedor: sobrescribe OPENAI_API_URL con otro endpoint compatible
# ═══════════════════════════════════
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.api-url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}

# ═══════════════════════════════════
# RapidAPI — Facebook Scraper (OSINT)
# IMPORTANTE: configurar RAPIDAPI_KEY como variable de entorno en Render
# ═══════════════════════════════════
app.rapidapi.key=${RAPIDAPI_KEY:}
app.rapidapi.facebook-host=facebook-scraper3.p.rapidapi.com

# ═══════════════════════════════════════════════════════════
# OSINT V2 — Scheduler, Rate Limiting, Deduplicación
# ═══════════════════════════════════════════════════════════
app.osint.scheduler.enabled=${OSINT_SCHEDULER_ENABLED:true}
app.osint.default-city=${OSINT_DEFAULT_CITY:Pasto}
app.osint.max-items-per-execution=${OSINT_MAX_ITEMS:20}
app.osint.dedup-radius-meters=${OSINT_DEDUP_RADIUS:500}
app.osint.dedup-hours=${OSINT_DEDUP_HOURS:24}

# ═══════════════════════════════════
# Correo — Brevo (Sendinblue) API HTTP
# Render Free Tier bloquea puertos SMTP (25/465/587).
# Brevo envía vía HTTPS sin necesitar dominio propio,
# solo el email sender verificado en brevo.com.
# Plan gratuito: 300 correos/día.
# ═══════════════════════════════════
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@safecity.ai}
app.brevo.sender-name=${BREVO_SENDER_NAME:SafeCity AI}

# ═══════════════════════════════════
# JWT — Autenticación y Sesiones
# Expiración: 20 minutos (1200000ms) por defecto
# El frontend renueva el token si el usuario está activo
# ═══════════════════════════════════
app.jwt.expiration=${JWT_EXPIRATION:1200000}

# ═══════════════════════════════════
# Admin — Cuenta inicial del administrador
# Configura estas variables en Render para no exponer credenciales en el código.
# ═══════════════════════════════════
app.admin.email=${ADMIN_EMAIL:admin@safecity.ai}
app.admin.password=${ADMIN_PASSWORD:Admin2026!}
app.admin.name=${ADMIN_NAME:Administrador SafeCity}

# ═══════════════════════════════════
# URL Frontend — para links en correos y redirects
# ═══════════════════════════════════
app.frontend.url=${FRONTEND_URL:https://safe-cityai.vercel.app}
