# =============================================
# PERFIL DE DESARROLLO (dev)
# Este archivo solo se carga cuando
# spring.profiles.active=dev está activo.
# =============================================

# ================================
# Base de datos H2 en disco (persistente)
# ================================
# Usa H2 con archivo en disco para que los datos
# persistan entre reinicios. Cambiado de H2 en memoria
# (que borraba todo al reiniciar) a archivo local.
spring.datasource.url=jdbc:h2:file:./data/safecity_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ================================
# Consola web de H2
# ================================
# Accesible en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ================================
# JPA / Hibernate - Esquema automático
# ================================
# "update" = crea o actualiza tablas según las @Entity, SIN borrar datos.
# Antes era "create-drop" (borraba todo al reiniciar).
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ================================
# Logs de SQL visibles
# ================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
